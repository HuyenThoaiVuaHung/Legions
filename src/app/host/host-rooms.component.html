<div class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,18rem),1fr))] gap-5">
  <button class="new-card" [disabled]="store.busy()" (click)="store.newRoom()">
    <mat-icon>add</mat-icon>
    Tạo phòng
  </button>
  @for (room of store.profile()?.rooms ?? []; track room.roomId) {
    <mat-card appearance="outlined" matRipple class="group cursor-pointer" tabindex="0" (click)="store.enter(room)" (keydown.enter)="store.enter(room)">
      <mat-card-content class="flex flex-col gap-1">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h6 class="m-0 truncate">{{ room.name || ('Phòng ' + room.code) }}</h6>
            <small class="text-xs opacity-70 font-mono">{{ room.code }}</small>
          </div>
          <button
            mat-icon-button
            type="button"
            class="-mt-1 -mr-2 shrink-0"
            aria-label="Tùy chọn phòng"
            [matMenuTriggerFor]="roomMenu"
            (click)="$event.stopPropagation()"
            (keydown.enter)="$event.stopPropagation()"
          >
            <mat-icon>more_vert</mat-icon>
          </button>
        </div>
        <small class="text-xs opacity-70">Tạo lúc {{ store.date(room.createdAt) }}</small>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-button type="button" (click)="$event.stopPropagation(); store.renameRoom(room)">
          <mat-icon>edit</mat-icon>
          Đổi tên
        </button>
        <button mat-button type="button" (click)="$event.stopPropagation(); store.enter(room)">
          <mat-icon>admin_panel_settings</mat-icon>
          Quản trị
        </button>
      </mat-card-actions>
    </mat-card>
    <mat-menu #roomMenu="matMenu">
      <button mat-menu-item (click)="store.enter(room)">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>Mở quản trị</span>
      </button>
      <button mat-menu-item (click)="store.renameRoom(room)">
        <mat-icon>drive_file_rename_outline</mat-icon>
        <span>Đổi tên phòng</span>
      </button>
    </mat-menu>
  }
</div>
