<div class="disablePointerActions overflow-hidden w-screen h-screen flex items-center justify-center p-8 box-border">
  <div class="grid grid-cols-4 gap-6 w-full max-w-7xl">
    @for (player of session.match()?.players ?? []; track $index) {
      <div class="score-card relative aspect-[3/4] rounded-2xl overflow-hidden shadow-2xl flex flex-col justify-end">
        <img
          class="absolute inset-0 w-full h-full object-cover"
          [src]="assets.image('contestants/' + ($index + 1) + '.png')"
          [alt]="player.name"
          (error)="$any($event.target).src.includes('placeholder') || ($any($event.target).src = assets.brand('placeholder'))"
        />
        <div class="score-scrim absolute inset-0"></div>
        <div class="relative z-10 p-6 flex flex-col gap-2 text-left">
          <span class="score-name text-3xl xl:text-4xl font-semibold leading-tight truncate">
            {{ player.name }}
          </span>
          <span class="score-value text-6xl xl:text-7xl font-bold tabular-nums leading-none">
            {{ player.score }}
          </span>
        </div>
      </div>
    }
  </div>
</div>
