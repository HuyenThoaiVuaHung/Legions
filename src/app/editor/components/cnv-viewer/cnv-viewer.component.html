@if (layers().length) {
  <div class="!aspect-video rounded-xl overflow-hidden w-full relative bg-surface-container">
    @for (src of layers(); track $index) {
      <img
        [src]="src"
        alt="Hình ảnh chướng ngại vật"
        class="absolute inset-0 w-full h-full object-cover pointer-events-none"
      />
    }
  </div>
}
