@if (!src) {
  <div (dragover)="dragOver($event)" (dragleave)="dragLeave($event)" (drop)="drop($event)">
    <button type="button" class="new-card w-full flex-col px-4 py-5" [class.media-dragging]="dragging" [disabled]="disabled" (click)="handleImageInput()">
      <span class="flex items-center gap-2">
        <mat-icon>{{ allowVideo ? 'perm_media' : 'add_photo_alternate' }}</mat-icon>
        {{ title || 'Thêm ảnh' }}
      </span>
    </button>
  </div>
} @else {
<div class="w-min min-w-[15rem] max-h-[30rem]">
  <div
    [ngClass]="{
      'h-16': description,
      'h-6': !description,
      'h-0': !title
    }"
    class="w-fit"
  >
    @if (title) {
    <h6 class="">
      <strong>
        {{ title }}
      </strong>
    </h6>
    } @if (description){
    <div class="text-wrap">
      {{ description }}
    </div>
    }
  </div>
  <div
    mat-ripple
    class="border-[0.1px] base-theme border-theme group rounded-xl relative h-[15rem] w-max min-w-[15rem] border-solid mt-5"
  >
    <div
      class="w-full bg-theme bg-opacity-10 absolute grid gap-2 place-items-center top-0 left-0 transition-opacity rounded-xl h-full opacity-0 group-hover:opacity-100 cursor-pointer"
    >
      <button mat-raised-button [disabled]="disabled" (click)="handleImageInput()">
        <mat-icon>upload_file</mat-icon>
        Tải ảnh mới
      </button>
    </div>
    <img [src]="src" class="object-contain h-full w-full" />
  </div>
</div>
}
@if (error) { <small class="error-text" role="alert">{{ error }}</small> }
