<h3 mat-dialog-title>
  <strong>Cắt ảnh</strong>
</h3>
<mat-dialog-content class="cropper-dialog-content">
  <div class="cropper-wrap">
    <image-cropper
      [imageFile]="data.image"
      (imageCropped)="imageCropped($event)"
      [maintainAspectRatio]="true"
      [aspectRatio]="data.aspectRatioX / data.aspectRatioY"
      format="png"
    ></image-cropper>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Hủy</button>
  <button mat-flat-button [disabled]="!resultImage" [mat-dialog-close]="resultImage">Lưu</button>
</mat-dialog-actions>
