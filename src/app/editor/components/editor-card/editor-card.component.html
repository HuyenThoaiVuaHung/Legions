@if (editorData) {
@if (hosted) {
  <mat-card appearance="outlined">
    <mat-card-content>
      <h3 class="mat-title-large">{{ editorData.matchData.matchName }}</h3>
      <p class="text-sm opacity-70">Bản nháp · Chỉ trên trình duyệt này</p>
      <div class="flex flex-wrap gap-2 mt-4"><button mat-flat-button (click)="load()">Mở bản nháp</button><button mat-button (click)="delete()">Xoá</button></div>
    </mat-card-content>
  </mat-card>
} @else {
<mat-card (dblclick)="this.load()" @fade appearance="outlined" class="group h-full">
  <mat-card-content>
    <h6>
      {{ editorData.matchData.matchName }}
    </h6>
    <player-table
      [players]="editorData.matchData.players"
      [editable]="false"
    ></player-table>
    <small class="opacity-20 text-xs">{{ uid }}</small>
  </mat-card-content>
  <div
    class="w-full z-50 bg-theme bg-opacity-10 !absolute flex justify-end items-end box-border p-2 gap-2 top-0 left-0 transition-opacity rounded-xl h-full opacity-0 group-hover:opacity-100"
  >
    <button mat-raised-button (click)="this.delete()">
      <mat-icon>delete</mat-icon>
      Xoá
    </button>
    <button mat-raised-button (click)="this.download()">
      <mat-icon>file_download</mat-icon>
      Lưu
    </button>
    <button mat-raised-button (click)="this.load()">
      <mat-icon>file_open</mat-icon>
      Mở
    </button>
  </div>
</mat-card>
}
}
