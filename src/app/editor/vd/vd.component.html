@if (editorDataService.editorData) {
<div class="mb-3 flex flex-wrap items-center gap-3">
  <span class="mat-label-large opacity-75">Thí sinh số</span>
  @for (playerIndex of [0,1,2,3]; track playerIndex) {
  <button
    mat-stroked-button
    [disabled]="this.selectedPlayerIndex == playerIndex"
    (click)="this.selectedPlayerIndex = playerIndex"
  >
    {{ playerIndex + 1 }}
  </button>
  }
</div>
<question-table mediaPlacement="inline" context="vd" (questionsChangeEvent)="editorDataService.saveCurrentEditorData()" [questions]="editorDataService.editorData.questionBank.vd.questions[selectedPlayerIndex]"></question-table>
}
